{% extends 'base.html' %}
{% block title %}Two-Factor Verification — ChessHub{% endblock %}

{% block content %}
<div class="container mt-5 mb-5" style="max-width:420px;">
  <div class="card p-4">

    <div class="text-center mb-4">
      <div style="font-size:2.8rem;">🔐</div>
      <h4 class="fw-bold mt-2 mb-1">Verification required</h4>
      <p class="text-muted small mb-0">
        Enter the 6-digit code from your authenticator app.
      </p>
    </div>


    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="mb-3">
        <label class="form-label small fw-semibold">Authentication Code</label>
        <input type="text" name="code" class="form-control form-control-lg text-center fw-bold"
               maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code"
               placeholder="000000" autofocus
               style="letter-spacing:.35rem;font-size:1.5rem;">
      </div>

      <button type="submit" class="btn btn-chess w-100">Verify</button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'logout' %}" class="text-muted small">Sign in as a different user</a>
    </div>

  </div>
</div>
{% endblock %}
